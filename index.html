<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5B Seating Plan Editor</title>
<style>
  :root {
    --house-red: #d9534f;
    --house-white: #9e9e9e;
    --house-yellow: #f0ad4e;
    --house-green: #5cb85c;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", "Microsoft JhengHei", Arial, sans-serif;
    margin: 0; padding: 16px; background: #f2f4f7; color: #222;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #666; font-size: 13px; margin-bottom: 12px; }
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    margin-bottom: 14px;
  }
  .toolbar button {
    padding: 8px 14px; border: 1px solid #c9d2dd; border-radius: 6px;
    background: #fff; font-size: 13px; cursor: pointer;
  }
  .toolbar button:hover { background: #eef3f9; }
  .toolbar button.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  .toolbar button.primary:hover { background: #175bce; }
  #status { font-size: 12px; color: #888; margin-left: auto; }

  .classroom {
    display: inline-block; background: #fff; border: 1px solid #d4dbe3;
    border-radius: 10px; padding: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.08);
  }
  .locker {
    text-align: center; padding: 8px; margin-bottom: 12px;
    border: 2px dashed #8b9bad; border-radius: 8px; color: #5b6b7b;
    font-weight: 600; letter-spacing: 4px; font-size: 14px;
  }
  .row { display: flex; justify-content: center; margin-bottom: 10px; }
  .desk {
    display: flex; border: 2px solid #b7c3cf; border-radius: 8px; overflow: hidden;
    background: #fbfcfd;
  }
  .aisle { width: 34px; flex: none; }
  .seat {
    width: 150px; min-height: 84px; padding: 6px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .seat + .seat { border-left: 1px dashed #b7c3cf; }
  .seat.hover { background: #e7f0fb; outline: 2px dashed #1f6feb; outline-offset: -2px; }
  .card {
    border: 1px solid #c3ccd6; border-left: 5px solid var(--house-white);
    border-radius: 6px; background: #fff; padding: 5px 7px; cursor: grab;
    font-size: 11.5px; line-height: 1.25; box-shadow: 0 1px 2px rgba(0,0,0,.08);
    user-select: none;
  }
  .card .num { display: inline-block; font-weight: 700; margin-right: 4px; color: #333; }
  .card.dragging { opacity: .4; }
  .card.selected { outline: 2px solid #1f6feb; }
  .card.house-Red { border-left-color: var(--house-red); }
  .card.house-White { border-left-color: var(--house-white); }
  .card.house-Yellow { border-left-color: var(--house-yellow); }
  .card.house-Green { border-left-color: var(--house-green); }

  .bottom { display: flex; justify-content: flex-end; margin-top: 6px; }
  .teachers {
    width: 220px; text-align: center; padding: 8px;
    border: 2px solid #b7c3cf; border-radius: 8px; color: #5b6b7b;
    font-weight: 600; letter-spacing: 2px; font-size: 13px; background: #fbfcfd;
  }

  .tray {
    margin-top: 16px; background: #fff; border: 1px solid #d4dbe3;
    border-radius: 10px; padding: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08);
  }
  .tray h2 { font-size: 14px; margin: 0 0 8px; }
  .tray .seats { display: flex; flex-wrap: wrap; gap: 8px; min-height: 60px; }
  .tray .seat { width: 150px; min-height: 46px; border: 1px dashed #c3ccd6; border-radius: 6px; padding: 4px; }
  .tray .seat.hover { background: #e7f0fb; }

  @media print {
    body { background: #fff; padding: 0; }
    .toolbar, .tray, .sub, #status { display: none !important; }
    .classroom { border: none; box-shadow: none; padding: 0; }
    .seat { width: 140px; min-height: 76px; }
    .card { box-shadow: none; }
  }
</style>
</head>
<body>
<h1>5B Seating Plan Editor</h1>
<div class="sub">Drag cards between seats &bull; or click a card, then click a seat &bull; changes are saved automatically</div>
<div class="toolbar">
  <button class="primary" onclick="savePlan()">Save</button>
  <button onclick="randomize()">Random</button>
  <button class="primary" onclick="exportWord()">Export Word</button>
  <button onclick="restoreDefault()">Restore 5B Default</button>
  <button onclick="clearAll()">Clear All</button>
  <span id="status"></span>
</div>

<div class="classroom">
  <div class="locker">LOCKER</div>
  <div id="rows"></div>
  <div class="bottom"><div class="teachers">TEACHER&rsquo;S DESK</div></div>
</div>

<div class="tray">
  <h2>Unassigned / Spare</h2>
  <div id="tray" class="seats"></div>
</div>

<script>
const ROSTER = [
  {num:1,  name:'CHAN CHI YING (CARLEY)',       house:'Red'},
  {num:2,  name:'CHAN HEI TING (MARINE)',       house:'White'},
  {num:3,  name:'CHAN JACEY KEI YING',          house:'White'},
  {num:4,  name:'CHAN TSZ YIU (OLIVIA)',        house:'White'},
  {num:5,  name:'CHAN YIN YU (VICKY)',          house:'White'},
  {num:6,  name:'CHEN JIAQI (SALLY)',           house:'Yellow'},
  {num:7,  name:'CHENG CHIN TUNG (TOBY)',       house:'Red'},
  {num:8,  name:'CHEUNG MARIE CHEUK SUM',       house:'Yellow'},
  {num:9,  name:'CHEUNG TSZ WAI (ZAVIYA)',      house:'Red'},
  {num:10, name:'CHOW HO WAI HOLLY',            house:'Yellow'},
  {num:11, name:'FAN YAN YIN (JOANNA)',         house:'White'},
  {num:12, name:'FU YUNG (JOYCE)',              house:'Green'},
  {num:13, name:'LAU TSZ YING (NANA)',          house:'White'},
  {num:14, name:'LAW WAI LING (LING LING)',     house:'Green'},
  {num:15, name:'LEE WING TUNG (NICOLE)',       house:'Red'},
  {num:16, name:'LEE YAN YIN (EMMA)',           house:'Yellow'},
  {num:17, name:'LEE YIK LING (ELAINE)',        house:'Red'},
  {num:18, name:'LEUNG HOI KIU (KATY)',         house:'White'},
  {num:19, name:'LEUNG PUI YEE (CHLOE)',        house:'Yellow'},
  {num:20, name:'LEUNG WING YAN (SHARON)',      house:'Yellow'},
  {num:21, name:'LEUNG YUET YAN OLIVIA (OLIVIA)', house:'Yellow'},
  {num:22, name:'LI TSZ KIU (LETTY)',           house:'Green'},
  {num:23, name:'MAK YAN TUNG (RACHEL)',        house:'Yellow'},
  {num:24, name:'PUN HANG LAM (ELLA)',          house:'Green'},
  {num:25, name:'TANG HAU MAN (EVA)',           house:'White'},
  {num:26, name:'WONG CHEUK TUNG KATIE',        house:'Red'},
  {num:27, name:'ZHANG SUM YIK (SANDY)',        house:'Yellow'}
];

const DEFAULT_LAYOUT = [
  [null,null, 3,21,  5,6,  null,null],
  [12,17,     15,20, 4,26, 16,14],
  [24,9,      13,23, 2,27, 1,22],
  [10,7,      25,8,  null,11, 18,19]
];

const ROWS = 4, SEATS = 8, KEY = '5b-seating-plan-v1';
const studentByNum = Object.fromEntries(ROSTER.map(s => [s.num, s]));
let layout = JSON.parse(JSON.stringify(DEFAULT_LAYOUT));
let selected = null;

function deepClone(l) { return l.map(r => r.slice()); }
function usedNums() { return layout.flat().filter(n => n !== null); }
function unassigned() { return ROSTER.map(s => s.num).filter(n => !usedNums().includes(n)); }

function render() {
  const rowsEl = document.getElementById('rows');
  rowsEl.innerHTML = '';
  layout.forEach((row, r) => {
    const rowEl = document.createElement('div');
    rowEl.className = 'row';
    row.forEach((num, s) => {
      if (s % 2 === 0) {
        const desk = document.createElement('div');
        desk.className = 'desk';
        desk.appendChild(makeSeat(r, s));
        desk.appendChild(makeSeat(r, s + 1));
        rowEl.appendChild(desk);
      }
      if (s === 1 || s === 3 || s === 5) {
        const aisle = document.createElement('div');
        aisle.className = 'aisle';
        rowEl.appendChild(aisle);
      }
    });
    rowsEl.appendChild(rowEl);
  });
  const tray = document.getElementById('tray');
  tray.innerHTML = '';
  const traySeat = makeTraySeat();
  tray.appendChild(traySeat);
  unassigned().forEach(num => traySeat.appendChild(makeCard(num)));
  updateStatus();
}

function makeSeat(r, s) {
  const el = document.createElement('div');
  el.className = 'seat';
  el.dataset.r = r; el.dataset.s = s; el.dataset.tray = '0';
  const num = layout[r][s];
  if (num !== null) el.appendChild(makeCard(num));
  wireSeat(el);
  return el;
}

function makeTraySeat() {
  const el = document.createElement('div');
  el.className = 'seat';
  el.dataset.tray = '1';
  wireSeat(el);
  return el;
}

function makeCard(num) {
  const st = studentByNum[num];
  const el = document.createElement('div');
  el.className = 'card house-' + st.house;
  el.draggable = true;
  el.dataset.num = num;
  el.innerHTML = '<span class="num">' + st.num + '</span>' + st.name;
  el.addEventListener('dragstart', e => {
    e.dataTransfer.setData('text/plain', String(num));
    e.dataTransfer.effectAllowed = 'move';
    el.classList.add('dragging');
  });
  el.addEventListener('dragend', () => el.classList.remove('dragging'));
  el.addEventListener('click', e => {
    e.stopPropagation();
    if (selected === num) { selected = null; }
    else { selected = num; }
    document.querySelectorAll('.card').forEach(c => c.classList.toggle('selected', c.dataset.num == selected));
    document.querySelectorAll('.seat').forEach(s => s.classList.toggle('pickup', selected != null));
  });
  return el;
}

function wireSeat(el) {
  el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('hover'); });
  el.addEventListener('dragleave', () => el.classList.remove('hover'));
  el.addEventListener('drop', e => {
    e.preventDefault();
    el.classList.remove('hover');
    const num = parseInt(e.dataTransfer.getData('text/plain'), 10);
    if (!num) return;
    if (el.dataset.tray === '1') {
      removeFromLayout(num);
    } else {
      const r = parseInt(el.dataset.r, 10), s = parseInt(el.dataset.s, 10);
      moveTo(r, s, num);
    }
  });
  el.addEventListener('click', e => {
    if (selected === null || el.dataset.tray === '1') return;
    const r = parseInt(el.dataset.r, 10), s = parseInt(el.dataset.s, 10);
    moveTo(r, s, selected);
    selected = null;
    document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
    render();
  });
}

function removeFromLayout(num) {
  layout.forEach(row => row.forEach((v, i) => { if (v === num) row[i] = null; }));
  save(); render();
}

function moveTo(r, s, num) {
  if (layout[r][s] === num) return;
  const prev = findPos(num);
  const displaced = layout[r][s];
  if (prev) layout[prev.r][prev.s] = displaced;
  layout[r][s] = num;
  save(); render();
}

function findPos(num) {
  for (let r = 0; r < ROWS; r++)
    for (let s = 0; s < SEATS; s++)
      if (layout[r][s] === num) return { r, s };
  return null;
}

function updateStatus() {
  const placed = usedNums().length;
  document.getElementById('status').textContent = placed + ' / ' + ROSTER.length + ' students placed';
}

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(layout)); } catch (e) {}
}

function restoreDefault() {
  layout = deepClone(DEFAULT_LAYOUT);
  selected = null;
  save(); render();
}

function clearAll() {
  layout = Array.from({length: ROWS}, () => Array(SEATS).fill(null));
  selected = null;
  save(); render();
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function randomize() {
  const nums = shuffle(ROSTER.map(s => s.num));
  const slots = shuffle(Array.from({length: ROWS * SEATS}, (_, i) => i));
  layout = Array.from({length: ROWS}, () => Array(SEATS).fill(null));
  nums.forEach((num, i) => {
    const sl = slots[i];
    layout[Math.floor(sl / SEATS)][sl % SEATS] = num;
  });
  selected = null;
  save(); render();
}

function escapeXml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

const SEAT_W = [1813, 1813, 1814, 1814, 1814, 1814, 1816, 1817];
const BORDERS =
  '<w:tblBorders>' +
  '<w:top w:val="single" w:color="auto" w:sz="4" w:space="0"/>' +
  '<w:left w:val="single" w:color="auto" w:sz="4" w:space="0"/>' +
  '<w:bottom w:val="single" w:color="auto" w:sz="4" w:space="0"/>' +
  '<w:right w:val="single" w:color="auto" w:sz="4" w:space="0"/>' +
  '<w:insideH w:val="single" w:color="auto" w:sz="4" w:space="0"/>' +
  '<w:insideV w:val="single" w:color="auto" w:sz="4" w:space="0"/>' +
  '</w:tblBorders>';

function aisleCell() {
  return '<w:tc><w:tcPr><w:tcW w:w="340" w:type="dxa"/></w:tcPr><w:p/></w:tc>';
}

function seatCellXML(w, num) {
  if (num === null) {
    return '<w:tc><w:tcPr><w:tcW w:w="' + w + '" w:type="dxa"/></w:tcPr><w:p/></w:tc>';
  }
  const st = studentByNum[num];
  return '<w:tc><w:tcPr><w:tcW w:w="' + w + '" w:type="dxa"/></w:tcPr>' +
    '<w:p><w:r><w:t>5B</w:t></w:r><w:r><w:tab/></w:r><w:r><w:t>' + st.num + '</w:t></w:r></w:p>' +
    '<w:p><w:r><w:t xml:space="preserve">' + escapeXml(st.name) + '</w:t></w:r></w:p></w:tc>';
}

function rowXML(r) {
  const s = seatCellXML(SEAT_W[0], layout[r][0]) + seatCellXML(SEAT_W[1], layout[r][1]) + aisleCell() +
            seatCellXML(SEAT_W[2], layout[r][2]) + seatCellXML(SEAT_W[3], layout[r][3]) + aisleCell() +
            seatCellXML(SEAT_W[4], layout[r][4]) + seatCellXML(SEAT_W[5], layout[r][5]) + aisleCell() +
            seatCellXML(SEAT_W[6], layout[r][6]) + seatCellXML(SEAT_W[7], layout[r][7]);
  return '<w:tr><w:trPr><w:trHeight w:val="' + (r % 2 === 0 ? 1908 : 1828) + '"/></w:trPr>' + s + '</w:tr>';
}

function buildDocumentXML() {
  const body =
    '<w:tbl><w:tblPr><w:tblW w:w="0" w:type="auto"/>' + BORDERS + '</w:tblPr>' +
    '<w:tblGrid><w:gridCol w:w="15388"/></w:tblGrid>' +
    '<w:tr><w:trPr><w:trHeight w:val="631"/></w:trPr>' +
    '<w:tc><w:tcPr><w:tcW w:w="15388" w:type="dxa"/></w:tcPr>' +
    '<w:p><w:r><w:t>LOCKER</w:t></w:r></w:p></w:tc></w:tr></w:tbl>' +
    '<w:p/>' +
    '<w:tbl><w:tblPr><w:tblW w:w="15535" w:type="dxa"/>' + BORDERS + '</w:tblPr>' +
    '<w:tblGrid>' +
    '<w:gridCol w:w="1813"/><w:gridCol w:w="1813"/><w:gridCol w:w="340"/>' +
    '<w:gridCol w:w="1814"/><w:gridCol w:w="1814"/><w:gridCol w:w="340"/>' +
    '<w:gridCol w:w="1814"/><w:gridCol w:w="1814"/><w:gridCol w:w="340"/>' +
    '<w:gridCol w:w="1816"/><w:gridCol w:w="1817"/>' +
    '</w:tblGrid>' +
    rowXML(0) + rowXML(1) + rowXML(2) + rowXML(3) +
    '</w:tbl>' +
    '<w:p/>' +
    '<w:tbl><w:tblPr><w:tblW w:w="0" w:type="auto"/><w:jc w:val="right"/>' + BORDERS + '</w:tblPr>' +
    '<w:tblGrid><w:gridCol w:w="1990"/><w:gridCol w:w="775"/></w:tblGrid>' +
    '<w:tr><w:trPr><w:trHeight w:val="631"/><w:jc w:val="right"/></w:trPr>' +
    '<w:tc><w:tcPr><w:tcW w:w="2765" w:type="dxa"/><w:gridSpan w:val="2"/></w:tcPr>' +
    '<w:p><w:r><w:t>TEACHER\u2019S DESK</w:t></w:r></w:p></w:tc></w:tr>' +
    '<w:tr><w:trPr><w:gridBefore w:val="1"/><w:wBefore w:w="1990" w:type="dxa"/><w:trHeight w:val="605"/><w:jc w:val="right"/></w:trPr>' +
    '<w:tc><w:tcPr><w:tcW w:w="775" w:type="dxa"/></w:tcPr>' +
    '<w:p><w:pPr><w:jc w:val="right"/></w:pPr></w:p></w:tc></w:tr>' +
    '</w:tbl>' +
    '<w:p><w:pPr><w:sectPr>' +
    '<w:pgSz w:w="16838" w:h="11906" w:orient="landscape"/>' +
    '<w:pgMar w:top="720" w:right="720" w:bottom="284" w:left="720" w:header="851" w:footer="992" w:gutter="0"/>' +
    '<w:cols w:space="425"/><w:docGrid w:type="lines" w:linePitch="360"/>' +
    '</w:sectPr></w:pPr></w:p>';
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">' +
    '<w:body>' + body + '</w:body></w:document>';
}

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c;
  }
  return t;
})();

function crc32(u8) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function buildZip(files) {
  const enc = new TextEncoder();
  const now = new Date();
  const time = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  const date = (((now.getFullYear() - 1980) & 0x7F) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  const chunks = [];
  const central = [];
  let offset = 0;
  for (const f of files) {
    const nameBuf = enc.encode(f.name);
    const crc = crc32(f.data);
    const local = new Uint8Array(30 + nameBuf.length);
    const dv = new DataView(local.buffer);
    dv.setUint32(0, 0x04034b50, true);
    dv.setUint16(4, 20, true);
    dv.setUint16(6, 0x0800, true);
    dv.setUint16(8, 0, true);
    dv.setUint16(10, time, true);
    dv.setUint16(12, date, true);
    dv.setUint32(14, crc, true);
    dv.setUint32(18, f.data.length, true);
    dv.setUint32(22, f.data.length, true);
    dv.setUint16(26, nameBuf.length, true);
    dv.setUint16(28, 0, true);
    local.set(nameBuf, 30);
    chunks.push(local, f.data);
    const cent = new Uint8Array(46 + nameBuf.length);
    const cdv = new DataView(cent.buffer);
    cdv.setUint32(0, 0x02014b50, true);
    cdv.setUint16(4, 20, true);
    cdv.setUint16(6, 20, true);
    cdv.setUint16(8, 0x0800, true);
    cdv.setUint16(10, 0, true);
    cdv.setUint16(12, time, true);
    cdv.setUint16(14, date, true);
    cdv.setUint32(16, crc, true);
    cdv.setUint32(20, f.data.length, true);
    cdv.setUint32(24, f.data.length, true);
    cdv.setUint16(28, nameBuf.length, true);
    cdv.setUint32(42, offset, true);
    cent.set(nameBuf, 46);
    central.push(cent);
    offset += local.length + f.data.length;
  }
  let centralSize = 0;
  central.forEach(c => { centralSize += c.length; });
  const end = new Uint8Array(22);
  const edv = new DataView(end.buffer);
  edv.setUint32(0, 0x06054b50, true);
  edv.setUint16(8, files.length, true);
  edv.setUint16(10, files.length, true);
  edv.setUint32(12, centralSize, true);
  edv.setUint32(16, offset, true);
  const parts = chunks.concat(central, [end]);
  return new Blob(parts, { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
}

function exportWord() {
  const enc = new TextEncoder();
  const contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
    '<Default Extension="xml" ContentType="application/xml"/>' +
    '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
    '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>' +
    '</Types>';
  const rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>' +
    '</Relationships>';
  const docRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"/>';
  const styles = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">' +
    '<w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:eastAsia="PMingLiU"/><w:sz w:val="24"/><w:szCs w:val="24"/></w:rPr></w:rPrDefault>' +
    '<w:pPrDefault><w:pPr><w:spacing w:after="0" w:line="240" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults>' +
    '<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style>' +
    '</w:styles>';
  const files = [
    { name: '[Content_Types].xml', data: enc.encode(contentTypes) },
    { name: '_rels/.rels', data: enc.encode(rels) },
    { name: 'word/_rels/document.xml.rels', data: enc.encode(docRels) },
    { name: 'word/document.xml', data: enc.encode(buildDocumentXML()) },
    { name: 'word/styles.xml', data: enc.encode(styles) }
  ];
  download('5B Seating Plan.docx', buildZip(files), 'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
}

function savePlan() {
  save();
  const el = document.getElementById('status');
  el.textContent = 'Saved at ' + new Date().toLocaleTimeString();
  setTimeout(() => updateStatus(), 2500);
}

function download(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}

try {
  const saved = JSON.parse(localStorage.getItem(KEY));
  if (saved && Array.isArray(saved) && saved.length === ROWS &&
      saved.every(r => Array.isArray(r) && r.length === SEATS)) layout = saved;
} catch (e) {}

document.addEventListener('click', e => {
  if (!e.target.closest('.card') && !e.target.closest('.seat')) {
    selected = null;
    document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { selected = null; render(); } });

render();
</script>
</body>
</html>
